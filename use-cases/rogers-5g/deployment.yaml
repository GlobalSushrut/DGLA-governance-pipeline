apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogers-5g-security
  namespace: rogers-5g-production
  labels:
    app: rogers-5g-security
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rogers-5g-security
  template:
    metadata:
      labels:
        app: rogers-5g-security
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: security-core
        image: dgla/5g-security:latest
        resources:
          limits:
            memory: 1Gi
            cpu: 1
          requests:
            memory: 512Mi
            cpu: 500m
        env:
        - name: ROGERS_API_KEY
          valueFrom:
            secretKeyRef:
              name: rogers-5g-secrets
              key: api_key
        - name: MONGODB_URI
          value: "mongodb://dgla-mongodb:27017/rogers5g"
        - name: MONGODB_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: password
        - name: MERKLE_VERIFICATION_ENABLED
          value: "true"
        - name: DATA_RESIDENCY
          value: "Canada"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9443
          name: https
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rogers-5g-security
  namespace: rogers-5g-production
spec:
  selector:
    app: rogers-5g-security
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9443
    targetPort: 9443
    protocol: TCP
    name: https
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: rogers-5g-secrets
  namespace: rogers-5g-production
type: Opaque
data:
  api_key: Um9nZXJzNUdTZWN1cml0eUtleQ== # Rogers5GSecurityKey (example only)
