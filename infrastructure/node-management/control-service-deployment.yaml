apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogers-5g-production-control-service
  namespace: rogers-5g-production
  labels:
    app: dgla-control-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dgla-control-service
  template:
    metadata:
      labels:
        app: dgla-control-service
    spec:
      containers:
      - name: control-service
        image: dgla/control-service:latest
        ports:
        - containerPort: 8585
          name: control
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 250m
        env:
        - name: MONGODB_URI
          value: "mongodb://dgla-mongodb:27017/nodemanagement"
        - name: MONGODB_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: password
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: node-manager-secret
              key: auth_token
        livenessProbe:
          httpGet:
            path: /health
            port: 8585
          initialDelaySeconds: 30
          periodSeconds: 10
