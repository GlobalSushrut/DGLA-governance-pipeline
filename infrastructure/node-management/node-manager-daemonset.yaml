apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rogers-5g-production-node-manager
  namespace: rogers-5g-production
  labels:
    app: dgla-node-manager
spec:
  selector:
    matchLabels:
      app: dgla-node-manager
  template:
    metadata:
      labels:
        app: dgla-node-manager
    spec:
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      containers:
      - name: node-manager
        image: dgla/node-manager:latest
        securityContext:
          privileged: true
        resources:
          limits:
            memory: 200Mi
            cpu: 100m
          requests:
            memory: 100Mi
            cpu: 50m
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CONTROL_SERVER
          value: "dgla-control-service:8585"
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: node-manager-secret
              key: auth_token
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibkubelet
          mountPath: /var/lib/kubelet
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibkubelet
        hostPath:
          path: /var/lib/kubelet
