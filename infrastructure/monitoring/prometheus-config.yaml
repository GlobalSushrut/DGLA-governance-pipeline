apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rogers-5g-production
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - dgla-alertmanager:9093
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - source_labels: [__address__]
          regex: '(.*):10250'
          replacement: '${1}:9100'
          target_label: __address__
          action: replace
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
      - job_name: 'dgla-services'
        kubernetes_sd_configs:
        - role: service
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
      - job_name: 'mongodb'
        static_configs:
        - targets: ['dgla-mongodb:9216']
      - job_name: 'cdn-metrics'
        static_configs:
        - targets: ['dgla-cdn-service:9091']
  
  alert-rules.yml: |
    groups:
    - name: rogers-5g-production-alerts
      rules:
      - alert: HighMemoryUsage
        expr: (sum by (pod) (container_memory_usage_bytes{namespace="dgla"}) / sum by (pod) (container_spec_memory_limit_bytes{namespace="dgla"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} has high memory usage: {{ $value }}%"
      - alert: HighCpuUsage
        expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="dgla"}[5m])) / sum by (pod) (container_spec_cpu_quota{namespace="dgla"}) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} has high CPU usage: {{ $value }}%"
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="dgla"}[1h]) > 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} is restarting too frequently"
      - alert: MongoDbDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB instance is down"
          description: "MongoDB instance has been down for more than 1 minute"
      - alert: CdnHighLatency
        expr: histogram_quantile(0.95, sum(rate(dgla_cdn_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CDN high latency detected"
          description: "CDN 95th percentile latency is above 1 second"
