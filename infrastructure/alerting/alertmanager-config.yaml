apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: rogers-5g-production
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@dgla.io'
      smtp_auth_username: 'alertmanager'
      smtp_auth_password: 'password' # Replace with secret reference in production
      slack_api_url: 'https://hooks.slack.com/services/TXXXXXXXX/BXXXXXXXX/XXXXXXXXXX' # Replace with actual URL

    templates:
    - '/etc/alertmanager/template/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'sla-webhook'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        continue: true
      - match:
          severity: warning
        receiver: 'warning-alerts'
        continue: true
      - match:
          severity: info
        receiver: 'info-alerts'

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']

    receivers:
    - name: 'critical-alerts'
      slack_configs:
      - channel: '#dgla-critical-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
      email_configs:
      - to: 'ops-team@dgla.io'
        send_resolved: true
        
    - name: 'warning-alerts'
      slack_configs:
      - channel: '#dgla-warnings'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        
    - name: 'info-alerts'
      slack_configs:
      - channel: '#dgla-info'
        send_resolved: false
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        
    - name: 'sla-webhook'
      webhook_configs:
      - url: 'http://dgla-sla-service:8080/alert'
        send_resolved: true
