# Custom Resource Definition for customer-specific SLAs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sladefinitions.dgla.io
spec:
  group: dgla.io
  names:
    kind: SLADefinition
    plural: sladefinitions
    singular: sladefinition
    shortNames:
      - sla
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                customerConfig:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    allowCustomMetrics:
                      type: boolean
                serviceLevelTemplate:
                  type: object
                  properties:
                    name:
                      type: string
                    customMetrics:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          threshold:
                            x-kubernetes-int-or-string: true
                          violationPenalty:
                            type: string
                alertIntegration:
                  type: object
                  properties:
                    enableCustomRules:
                      type: boolean
                    alertManagerEndpoint:
                      type: string
                cryptographicVerification:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    merkleTreeStorage:
                      type: boolean
                    proofGenerationFrequency:
                      type: string
                notificationChannels:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      configurable:
                        type: boolean
