apiVersion: dgla.io/v1
kind: SLADefinition
metadata:
  name: financial-customer-sla
  namespace: customer-finance-prod
spec:
  customerConfig:
    enabled: true
    allowCustomMetrics: true
    customerName: "Global Financial Services, Inc."
    customerID: "GFS-12345"
    contractID: "DGLA-GFS-2025-06"
    
  # Finance industry specific SLA requirements
  serviceLevelTemplate:
    name: "finance-tier-1"
    customMetrics:
      - name: "response_time_ms"
        threshold: 50  # Ultra-low latency for financial transactions
        violationPenalty: "5% monthly fee per 5ms over threshold"
      - name: "uptime_percentage"
        threshold: 99.999  # Five nines for financial data
        violationPenalty: "10% monthly fee per 0.01% below threshold"
      - name: "data_sovereignty"
        threshold: true
        violationPenalty: "100% monthly fee + regulatory penalties"
      - name: "transaction_integrity"
        threshold: 100  # Custom metric for financial data integrity
        violationPenalty: "200% transaction value for each failed verification"
      - name: "regulatory_compliance"
        threshold: true
        violationPenalty: "Breach of contract + remediation"
        
  # Custom alert rules for financial data
  alertIntegration:
    enableCustomRules: true
    alertManagerEndpoint: "http://dgla-alertmanager:9093"
    customRules:
      - name: "TransactionVerificationFailure"
        query: "dgla_merkle_verification_failures{customer_id=\"GFS-12345\"} > 0"
        for: "1m"
        severity: "critical"
      - name: "FinancialDataLatency"
        query: "histogram_quantile(0.99, sum(rate(dgla_api_response_time_bucket{customer_id=\"GFS-12345\",endpoint=\"/finance/transactions\"}[5m])) by (le)) > 0.05"
        for: "2m"
        severity: "critical"
    
  # Enhanced cryptographic verification for financial transactions
  cryptographicVerification:
    enabled: true
    merkleTreeStorage: true
    proofGenerationFrequency: "perTransaction"
    retentionPeriod: "7y"  # Financial regulation requirement
    verificationAlgorithm: "post-quantum-resistant"
    auditFrequency: "daily"
    
  # Financial industry specific notification requirements
  notificationChannels:
    - type: "secureEmail"
      recipients: ["security@gfs.com", "compliance@gfs.com"]
      encryptionEnabled: true
    - type: "pagerduty"
      serviceKey: "${SECRET:gfs-pagerduty-key}"
      escalationPolicy: "finance-critical"
    - type: "webhook"
      endpoint: "https://gfs-internal-monitoring.example.com/dgla-alerts"
      authHeader: "${SECRET:gfs-webhook-auth}"
    - type: "regulatoryAPI"
      endpoint: "https://financial-regulator.gov/api/compliance-reporting"
      apiKey: "${SECRET:regulatory-api-key}"
      reportingRequirement: "immediate"
