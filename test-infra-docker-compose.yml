version: '3.3'

services:
  # Use a pre-built Swagger UI for testing the API documentation
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: dgla-swagger-ui
    ports:
      - "8082:8080"
    environment:
      - SWAGGER_URL=http://localhost:8081/swagger.json
    networks:
      - dgla-network
  
  # Redis service for caching
  redis:
    image: redis:7-alpine
    container_name: dgla-redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dgla-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dgla-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - dgla-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: dgla-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - dgla-network
    depends_on:
      - prometheus

networks:
  dgla-network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
