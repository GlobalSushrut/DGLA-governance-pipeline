apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: prometheus
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    jsonData:
      timeInterval: 10s
      httpMethod: GET
      exemplarTraceIdDestinations:
        - name: TraceID
          datasourceUid: tempo
    version: 1
    editable: true
