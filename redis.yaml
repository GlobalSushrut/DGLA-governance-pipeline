apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgla-redis
  namespace: dgla
spec:
  selector:
    matchLabels:
      app: dgla-redis
  replicas: 1
  template:
    metadata:
      labels:
        app: dgla-redis
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine
        command:
        - redis-server
        - --requirepass
        - redispass
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: dgla-redis
  namespace: dgla
spec:
  selector:
    app: dgla-redis
  ports:
  - port: 6379
    targetPort: 6379
