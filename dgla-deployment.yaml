apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgla-api
  namespace: dgla
  labels:
    app: dgla-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dgla-api
  template:
    metadata:
      labels:
        app: dgla-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8081"
    spec:
      containers:
      - name: dgla-api
        image: dgla-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DGLA_SERVER_PORT
          value: "8081"
        - name: DGLA_LOG_LEVEL
          value: "info"
        - name: DGLA_AUTH_ENABLED
          value: "true"
        - name: DGLA_AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dgla-secrets
              key: jwt-secret
        - name: DGLA_CACHE_TYPE
          value: "redis"
        - name: DGLA_CACHE_REDIS_HOST
          value: "dgla-redis"
        - name: DGLA_CACHE_REDIS_PORT
          value: "6379"
        - name: DGLA_CACHE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dgla-secrets
              key: redis-password
        - name: DGLA_CACHE_REDIS_DB
          value: "0"
        livenessProbe:
          httpGet:
            path: /alive
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /app/config.json
          subPath: config.json
      volumes:
      - name: config
        configMap:
          name: dgla-config
---
apiVersion: v1
kind: Service
metadata:
  name: dgla-api
  namespace: dgla
spec:
  selector:
    app: dgla-api
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
  type: NodePort
